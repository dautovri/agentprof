name: Feature request
description: Support another agent, config format or check.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What slows your agent down or costs you context today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should agentprof measure or fix? Link vendor documentation for any agent behaviour it relies on.
