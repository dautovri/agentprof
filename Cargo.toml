[package]
name = "agentprof"
version = "0.3.0"
edition = "2024"
rust-version = "1.88"
authors = ["Ruslan Dautov <dautovri@gmail.com>"]
description = "Measures and fixes what slows AI coding agents down: instruction bloat, MCP tool load, secrets agents can read, and shell overhead"
homepage = "https://dautovri.github.io/agentprof/"
documentation = "https://github.com/dautovri/agentprof#readme"
keywords = ["ai-agents", "claude-code", "mcp", "cli", "developer-tools"]
categories = ["command-line-utilities", "development-tools"]
exclude = [".github/", "docs/", "action.yml", "install.sh", "scripts/"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/dautovri/agentprof"

[dependencies]
clap = { version = "4.5", features = ["derive", "cargo"] }
clap_complete = "4.5"
tiktoken-rs = "0.12"
comfy-table = "8.0"
owo-colors = { version = "4.1", features = ["supports-colors"] }
ignore = "0.4"
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
anyhow = "1.0"
walkdir = "2.5"
which = "8.0"
ratatui = "0.30"
crossterm = "0.29"
toml = { version = "1", default-features = false, features = ["parse", "serde", "std"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
