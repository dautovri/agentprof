[package]
name = "agentprof"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
authors = ["Ruslan Dautov <dautovri@gmail.com>"]
description = "AI Agent Workspace Optimizer & Shell Startup Profiler"
license = "MIT"
readme = "README.md"
repository = "https://github.com/dautovri/agentprof"

[dependencies]
clap = { version = "4.5", features = ["derive", "cargo"] }
clap_complete = "4.5"
tiktoken-rs = "0.6"
comfy-table = "7.1"
owo-colors = { version = "4.1", features = ["supports-colors"] }
ignore = "0.4"
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
anyhow = "1.0"
walkdir = "2.5"
indicatif = "0.17"
which = "7.0"
ratatui = "0.29"
crossterm = "0.28"

