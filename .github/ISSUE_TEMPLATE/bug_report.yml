name: Bug report
description: Something agentprof does is wrong or crashes.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: The command you ran, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output
      description: Relevant output. `--json` output is most useful. Remove anything private.
      render: text
  - type: input
    id: version
    attributes:
      label: agentprof version
      placeholder: agentprof --version
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: OS and shell
      placeholder: macOS 15 / zsh
    validations:
      required: true
  - type: dropdown
    id: agents
    attributes:
      label: Agents involved
      multiple: true
      options: [Claude Code, Cursor, Codex, OpenCode, Gemini CLI, GitHub Copilot, Windsurf, Other]
